<!DOCTYPE html>
<!-- نسخة ملف واحد: كل الأنماط والسكربت مضمّنة. تعمل بفتح الملف مباشرة. -->

<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="">
<meta name="description" content="">
<meta name="theme-color" content="">
<link rel="canonical" id="canonical" href="">
<meta property="og:type" content="website">
<meta property="og:site_name" id="ogSiteName" content="">
<meta property="og:title" id="ogTitle" content="">
<meta property="og:description" id="ogDescription" content="">
<meta property="og:url" id="ogUrl" content="">
<meta property="og:locale" content="ar_SA">
<title></title>
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   فني مطابخ صيانة وتفصيل — الأنماط
   لون واحد فقط: #0f766e — خط واحد فقط: Cairo (400 / 700)
   لا تدرجات، لا زجاج، لا ظلال ثقيلة، حركة 200ms فقط.
   ========================================================= */

/* ---------- 1. المتغيرات ---------- */
:root {
  --accent: #0f766e;
  --on-accent: #ffffff;
  --accent-text: var(--accent);

  --bg: #ffffff;
  --bg-tint: #f5f8f7;
  --surface: #ffffff;
  --surface-2: #f3f7f6;
  --line: #dfe7e5;
  --text: #0b1a18;
  --text-2: #3d5451;
  --muted: #5b6f6c;

  --radius-sm: 10px;
  --radius: 14px;
  --radius-lg: 18px;

  --wrap: 1120px;
  --header-h: 68px;
  --section-y: 72px;

  --t: 200ms;
  --ease: cubic-bezier(.2, .7, .3, 1);
}

@media (prefers-color-scheme: dark) {
  :root {
    /* نفس اللون تماماً — يُستخدم للتعبئة فقط، والنص على التعبئة أبيض */
    --accent: #0f766e;
    --on-accent: #ffffff;
    --accent-text: #eaf3f1;

    --bg: #0a1211;
    --bg-tint: #0e1917;
    --surface: #101c1a;
    --surface-2: #13211f;
    --line: #21332f;
    --text: #eaf3f1;
    --text-2: #b9cac7;
    --muted: #93a7a3;
  }
}

/* ---------- 2. إعادة الضبط ---------- */
*,
*::before,
*::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-padding-block-start: calc(var(--header-h) + 16px);
}

@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
}

html,
body {
  overflow-x: clip;
  max-width: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Cairo", "Segoe UI", Tahoma, sans-serif;
  font-weight: 400;
  font-size: 16px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
img, svg, iframe { max-width: 100%; }
a { color: inherit; text-decoration: none; }

button,
input,
textarea,
select {
  font: inherit;
  color: inherit;
  letter-spacing: inherit;
}

[hidden] { display: none !important; }

:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

::selection {
  background: var(--accent);
  color: var(--on-accent);
}

/* ---------- 3. أدوات عامة ---------- */
.wrap {
  width: 100%;
  max-width: var(--wrap);
  margin-inline: auto;
  padding-inline: 20px;
}

.skip {
  position: absolute;
  inset-inline-start: 12px;
  inset-block-start: -100px;
  z-index: 300;
  padding: 12px 18px;
  border-radius: var(--radius-sm);
  background: var(--accent);
  color: var(--on-accent);
  font-weight: 700;
  transition: inset-block-start var(--t) var(--ease);
}

.skip:focus-visible { inset-block-start: 12px; }

.section {
  padding-block: var(--section-y);
  scroll-margin-block-start: var(--header-h);
}

.section--tint { background: var(--bg-tint); }

.section h2 {
  font-size: clamp(22px, 1.6vw + 14px, 30px);
  font-weight: 700;
  line-height: 1.35;
  letter-spacing: -.2px;
  margin-block-end: 10px;
}

.section h1 {
  font-size: clamp(26px, 3.4vw + 12px, 44px);
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -.5px;
  margin-block-end: 14px;
}

.lead {
  color: var(--text-2);
  font-size: 15.5px;
  max-width: 62ch;
  margin-block-end: 28px;
}

.link {
  color: var(--accent-text);
  font-weight: 700;
  text-decoration: underline;
  text-underline-offset: 4px;
  text-decoration-thickness: 1px;
}

.link:hover { text-decoration-thickness: 2px; }

/* ---------- 4. الأزرار ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 48px;
  padding-inline: 18px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text);
  font-size: 15px;
  font-weight: 700;
  line-height: 1.2;
  text-align: center;
  cursor: pointer;
  transition: background-color var(--t) var(--ease),
              border-color var(--t) var(--ease),
              color var(--t) var(--ease),
              filter var(--t) var(--ease);
}

.btn svg {
  width: 18px;
  height: 18px;
  flex: none;
}

.btn--solid {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
}

.btn--solid:hover { filter: brightness(.93); }

.btn--ghost {
  background: transparent;
  border-color: var(--line);
  color: var(--text);
}

.btn--ghost:hover {
  border-color: var(--accent);
  color: var(--accent-text);
}

.btn--sm {
  min-height: 44px;
  padding-inline: 14px;
  font-size: 14px;
}

.btn--lg {
  min-height: 52px;
  padding-inline: 24px;
  font-size: 16px;
}

.btn--block { width: 100%; }

.btn:disabled,
.btn[disabled] {
  opacity: .45;
  cursor: not-allowed;
  filter: none;
}

/* ---------- 5. الهيدر ---------- */
.site-header {
  position: sticky;
  inset-block-start: 0;
  z-index: 140;
  background: var(--surface);
  border-block-end: 1px solid var(--line);
}

.site-header.is-stuck { border-block-end-color: var(--accent); }

.header__in {
  display: flex;
  align-items: center;
  gap: 16px;
  min-height: var(--header-h);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: none;
  min-height: 48px;
}

.brand__mark {
  display: block;
  width: 38px;
  height: 38px;
  flex: none;
}

.brand__mark svg {
  display: block;
  width: 100%;
  height: 100%;
}

.brand__text {
  display: flex;
  flex-direction: column;
  line-height: 1.3;
}

.brand__text strong {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
}

.brand__text small {
  font-size: 11.5px;
  font-weight: 400;
  color: var(--muted);
}

.header__actions {
  display: flex;
  align-items: center;
  gap: 8px;
  order: 3;
  margin-inline-start: auto;
}

.header__call { flex: none; }

.burger {
  display: none;
  place-items: center;
  width: 48px;
  height: 48px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
}

.burger__box {
  display: grid;
  gap: 4px;
  width: 20px;
}

.burger__box i {
  display: block;
  height: 2px;
  border-radius: 2px;
  background: var(--text);
  transition: transform var(--t) var(--ease), opacity var(--t) var(--ease);
}

html.nav-open .burger__box i:nth-child(1) { transform: translateY(6px) rotate(45deg); }
html.nav-open .burger__box i:nth-child(2) { opacity: 0; }
html.nav-open .burger__box i:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

html.nav-open .burger {
  position: relative;
  z-index: 150;
  background: var(--accent);
  border-color: var(--accent);
}

html.nav-open .burger__box i { background: var(--on-accent); }

/* القائمة — سطح المكتب */
.nav {
  display: flex;
  align-items: center;
  gap: 4px;
  order: 2;
}

.nav__list {
  display: flex;
  align-items: center;
  gap: 4px;
}

.nav__list a {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding-inline: 12px;
  border-radius: var(--radius-sm);
  font-size: 14.5px;
  font-weight: 700;
  color: var(--text-2);
  transition: color var(--t) var(--ease), background-color var(--t) var(--ease);
}

.nav__list a:hover {
  color: var(--accent-text);
  background: var(--surface-2);
}

.nav__foot { display: none; }

.nav-backdrop {
  position: fixed;
  inset: 0;
  z-index: 120;
  background: rgba(6, 20, 18, .55);
}

/* ---------- 6. الواجهة ---------- */
.hero__in {
  display: grid;
  grid-template-columns: 1.15fr .85fr;
  align-items: center;
  gap: 48px;
}

.status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 32px;
  padding: 4px 14px;
  margin-block-end: 16px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface-2);
  font-size: 13px;
  font-weight: 700;
  color: var(--text-2);
}

.status__dot {
  width: 8px;
  height: 8px;
  flex: none;
  border-radius: 50%;
  background: var(--muted);
}

.status.is-open {
  border-color: var(--accent);
  color: var(--accent-text);
}

.status.is-open .status__dot { background: var(--accent); }

.hero__lead {
  color: var(--text-2);
  font-size: 16px;
  max-width: 56ch;
  margin-block-end: 24px;
}

.hero__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-block-end: 28px;
}

.hero__facts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 20px;
}

.hero__facts li {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 13.5px;
  color: var(--text-2);
}

.hero__facts svg {
  width: 17px;
  height: 17px;
  flex: none;
  color: var(--accent);
}

.hero__art {
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface-2);
  padding: 18px;
}

.hero__art svg {
  display: block;
  width: 100%;
  height: auto;
}

.hero__art-foot {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-block-start: 12px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--muted);
}

/* ---------- 7. الخدمات ---------- */
.cards {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  transition: border-color var(--t) var(--ease);
}

.card:hover { border-color: var(--accent); }

.card__ico {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  margin-block-end: 2px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  color: var(--accent);
}

.card__ico svg {
  width: 23px;
  height: 23px;
}

.card h3 {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.45;
}

.card p {
  color: var(--text-2);
  font-size: 14.5px;
  flex: 1;
}

.card__order {
  align-self: flex-start;
  min-height: 48px;
  margin-block-start: 6px;
  padding-inline: 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--accent-text);
  font-size: 14.5px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color var(--t) var(--ease),
              border-color var(--t) var(--ease),
              color var(--t) var(--ease);
}

.card__order:hover {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
}

.features {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 10px 24px;
  margin-block-start: 28px;
  padding-block-start: 24px;
  border-block-start: 1px solid var(--line);
}

.features li {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 14.5px;
  color: var(--text-2);
}

.feature__ico {
  width: 18px;
  height: 18px;
  flex: none;
  color: var(--accent);
}

/* ---------- 8. أعمالنا (تمرير أفقي) ---------- */
.works {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  scroll-padding-inline: 20px;
  padding-block: 4px 12px;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
  cursor: grab;
}

.works.is-dragging {
  cursor: grabbing;
  scroll-snap-type: none;
}

.works::-webkit-scrollbar { height: 8px; }
.works::-webkit-scrollbar-track { background: var(--surface-2); border-radius: 8px; }
.works::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
.works::-webkit-scrollbar-thumb:hover { background: var(--accent); }

.work {
  flex: 0 0 auto;
  width: clamp(238px, 30vw, 336px);
  padding: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  overflow: hidden;
  scroll-snap-align: start;
  cursor: pointer;
  transition: border-color var(--t) var(--ease);
}

.work:hover,
.work:focus-visible { border-color: var(--accent); }

.work svg {
  display: block;
  width: 100%;
  height: auto;
}

.works__hint {
  margin-block-start: 6px;
  font-size: 13px;
  color: var(--muted);
}

/* ---------- 9. مناطق الخدمة ---------- */
.areas {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.areas li {
  flex: 1 1 132px;
  padding: 12px 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  font-size: 14.5px;
  font-weight: 700;
  text-align: center;
}

.areas__note {
  margin-block-start: 16px;
  font-size: 13.5px;
  color: var(--muted);
}

/* ---------- 10. التواصل + نموذج الطلب ---------- */
.composer {
  padding: 24px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
}

.composer__step + .composer__step { margin-block-start: 22px; }

.composer__label {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-block-end: 10px;
  font-size: 14.5px;
  font-weight: 700;
}

.composer__num {
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  flex: none;
  border-radius: 50%;
  background: var(--accent);
  color: var(--on-accent);
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip {
  min-height: 48px;
  padding: 8px 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  color: var(--text);
  font-size: 14.5px;
  font-weight: 400;
  line-height: 1.4;
  text-align: center;
  cursor: pointer;
  transition: background-color var(--t) var(--ease),
              border-color var(--t) var(--ease),
              color var(--t) var(--ease);
}

.chip:hover { border-color: var(--accent); }

.chip[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
  font-weight: 700;
}

.note {
  margin-block-start: 22px;
  border-block-start: 1px solid var(--line);
  padding-block-start: 14px;
}

.note summary {
  min-height: 44px;
  display: flex;
  align-items: center;
  font-size: 14px;
  font-weight: 700;
  color: var(--text-2);
  cursor: pointer;
  list-style: none;
}

.note summary::-webkit-details-marker { display: none; }

.note summary::after {
  content: "+";
  margin-inline-start: auto;
  font-size: 18px;
  line-height: 1;
  color: var(--accent);
}

.note[open] summary::after { content: "–"; }
.note summary:hover { color: var(--accent-text); }

.note textarea {
  width: 100%;
  min-height: 76px;
  margin-block-start: 10px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  color: var(--text);
  font-size: 14.5px;
  line-height: 1.7;
  resize: vertical;
}

.note textarea:focus-visible { border-color: var(--accent); }

.composer__summary {
  margin-block-start: 18px;
  font-size: 13.5px;
  color: var(--muted);
}

.composer__summary.is-ready {
  color: var(--accent-text);
  font-weight: 700;
}

.composer__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-block-start: 16px;
}

.composer__hint {
  margin-block-start: 12px;
  font-size: 12.5px;
  color: var(--muted);
}

.contact-info {
  display: grid;
  grid-template-columns: 1.15fr .85fr;
  gap: 20px;
  margin-block-start: 28px;
  align-items: start;
}

.map {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  overflow: hidden;
}

.map iframe {
  display: block;
  width: 100%;
  height: 300px;
  border: 0;
}

.map__foot {
  padding: 12px 14px;
  border-block-start: 1px solid var(--line);
}

.info {
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
}

.info__label {
  margin-block: 0 10px;
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: .3px;
  color: var(--muted);
}

.info__label ~ .info__label { margin-block-start: 20px; }

.hours { margin-block-end: 4px; }

.hours li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-block: 7px;
  border-block-end: 1px solid var(--line);
  font-size: 14px;
  color: var(--text-2);
}

.hours li:last-child { border-block-end: 0; }

.hours b { font-weight: 700; color: var(--text); }

.hours .is-today {
  color: var(--accent-text);
  font-weight: 700;
}

.hours .is-today b { color: var(--accent-text); }

.hours .is-off,
.hours .is-off b { color: var(--muted); }

/* ---------- 11. الفوتر ---------- */
.site-footer {
  padding-block: 34px;
  border-block-start: 1px solid var(--line);
  background: var(--bg-tint);
}

.footer__in {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  text-align: center;
}

.footer__name {
  font-size: 15px;
  font-weight: 700;
}

.footer__meta {
  font-size: 13.5px;
  color: var(--text-2);
}

.footer__credit {
  margin-block-start: 8px;
  font-size: 13px;
  color: var(--muted);
}

.footer__demo {
  font-size: 11.5px;
  letter-spacing: .4px;
  color: var(--muted);
}

/* ---------- 12. شريط الجوال ---------- */
.mobilebar {
  display: none;
  position: fixed;
  inset-inline: 0;
  inset-block-end: 0;
  z-index: 100;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: 10px;
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  background: var(--surface);
  border-block-start: 1px solid var(--line);
}

.mobilebar__status {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--muted);
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.mobilebar__status .status__dot { flex: none; }

.mobilebar__status.is-open {
  color: var(--accent-text);
}

.mobilebar__status.is-open .status__dot { background: var(--accent); }

.mobilebar__order {
  min-height: 48px;
  padding-inline: 16px;
  font-size: 14px;
}

.mobilebar__call {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  color: var(--accent);
}

.mobilebar__call svg {
  width: 21px;
  height: 21px;
}

/* ---------- 13. نافذة عرض العمل ---------- */
.lb {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 12px;
  padding: 16px;
  background: rgba(6, 20, 18, .9);
}

.lb__bar,
.lb__nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  color: #ffffff;
}

.lb__count {
  font-size: 13.5px;
  font-weight: 700;
  direction: ltr;
}

.lb__close,
.lb__arrow {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  padding: 0;
  border: 1px solid rgba(255, 255, 255, .45);
  border-radius: var(--radius-sm);
  background: transparent;
  color: #ffffff;
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
  transition: border-color var(--t) var(--ease), background-color var(--t) var(--ease);
}

.lb__close:hover,
.lb__arrow:hover {
  border-color: #ffffff;
  background: rgba(255, 255, 255, .14);
}

.lb__nav { justify-content: center; }

.lb__stage {
  display: grid;
  place-items: center;
  overflow: hidden;
}

.lb__stage svg {
  width: auto;
  max-width: 100%;
  max-height: 100%;
  height: auto;
  border-radius: var(--radius);
}

/* ---------- 14. الحركة (200ms فقط) ---------- */
@keyframes reveal {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: no-preference) {
  main > .section {
    animation: reveal var(--t) var(--ease) both;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ---------- 15. الاستجابة ---------- */
@media (max-width: 1024px) {
  .hero__in { gap: 32px; }
  .hero__art { padding: 14px; }
}

@media (max-width: 900px) {
  :root { --section-y: 48px; }

  body { padding-block-end: 74px; }

  /* القائمة الجانبية — تفتح من اليمين */
  .nav {
    position: fixed;
    inset-block: 0;
    inset-inline-start: 0;
    z-index: 130;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    width: min(86vw, 340px);
    padding: 18px;
    background: var(--surface);
    border-inline-start: 1px solid var(--line);
    transform: translateX(102%);
    visibility: hidden;
    transition: transform var(--t) var(--ease), visibility var(--t) var(--ease);
  }

  html.nav-open .nav {
    transform: none;
    visibility: visible;
  }

  .nav__list {
    flex-direction: column;
    align-items: stretch;
    gap: 2px;
  }

  .nav__list a {
    min-height: 48px;
    padding-inline: 12px;
    font-size: 15.5px;
    border-block-end: 1px solid var(--line);
    border-radius: 0;
  }

  .nav__list a:hover { background: transparent; }

  .nav__foot {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-block-start: auto;
    padding-block-start: 18px;
    border-block-start: 1px solid var(--line);
  }

  .nav__phone {
    display: grid;
    place-items: center;
    min-height: 48px;
    font-size: 15px;
    font-weight: 700;
    color: var(--accent-text);
  }

  .header__call { display: none; }
  .header__actions .btn--solid { display: none; }
  .burger { display: grid; }

  .header__in { gap: 10px; }

  .brand__text small { display: none; }

  .mobilebar { display: grid; }

  /* عناوين وأزرار في الوسط، فقرات من اليمين */
  .section h1,
  .section h2 { text-align: center; }

  .hero__lead,
  .lead { text-align: start; margin-inline: auto; }

  .hero__text { text-align: center; }
  .hero__lead { text-align: start; }
  .hero__actions { justify-content: center; }
  .hero__facts { justify-content: center; }

  .hero__in {
    grid-template-columns: 1fr;
    gap: 28px;
  }

  .hero__art { order: -1; }

  .cards,
  .features,
  .areas,
  .contact-info {
    grid-template-columns: 1fr;
  }

  .composer { padding: 18px; }
  .info { padding: 16px; }

  .composer__actions .btn { flex: 1 1 auto; }

  .work { width: min(76vw, 300px); }

  .footer__in { padding-inline: 8px; }
}

@media (max-width: 480px) {
  .wrap { padding-inline: 16px; }
  .brand__mark { width: 34px; height: 34px; }
  .brand__text strong { font-size: 14px; }
  .chip { padding-inline: 14px; font-size: 14px; }
  .composer { padding: 16px; border-radius: var(--radius); }
  .works { gap: 10px; }
}

/* ---------- 16. تباين عالٍ ---------- */
@media (prefers-contrast: more) {
  :root {
    --line: #9fb3b0;
    --text-2: #1f3431;
    --muted: #33504c;
  }
}

</style>

  /* ---------- الوقت والحالة ---------- */
  var DAY_KEYS = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
  var SCHEMA_MAP = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };

  function riyadhNow() {
    if (typeof Intl !== "undefined" && Intl.DateTimeFormat) {
      try {
        var parts = new Intl.DateTimeFormat("en-US", {
          timeZone: SITE_DATA.hours.timeZone,
          weekday: "short",
          hour: "2-digit",
          minute: "2-digit",
          hourCycle: "h23"
        }).formatToParts(new Date());
        var map = {};
        parts.forEach(function (p) { if (p.type !== "literal") map[p.type] = p.value; });
        var idx = SCHEMA_MAP[map.weekday];
        if (typeof idx === "number") {
          return { index: idx, key: DAY_KEYS[idx], minutes: (Number(map.hour) % 24) * 60 + Number(map.minute) };
        }
      } catch (e) { /* احتياطي */ }
    }
    var d = new Date(Date.now() + 3 * 3600 * 1000);
    return { index: d.getUTCDay(), key: DAY_KEYS[d.getUTCDay()], minutes: d.getUTCHours() * 60 + d.getUTCMinutes() };
  }

  function toMin(hhmm) {
    var p = String(hhmm).split(":");
    return Number(p[0]) * 60 + Number(p[1]);
  }

  function fmtClock(hhmm) {
    var p = String(hhmm).split(":");
    var h = Number(p[0]);
    var suffix = h < 12 ? "ص" : "م";
    var h12 = h % 12;
    if (h12 === 0) h12 = 12;
    return h12 + (p[1] === "00" ? "" : ":" + p[1]) + " " + suffix;
  }

  function dayName(key) {
    var found = SITE_DATA.hours.days.filter(function (d) { return d.key === key; })[0];
    return found ? found.name : "";
  }

  function shiftOpen(sch, minutes) {
    var o = toMin(sch[0]), c = toMin(sch[1]);
    if (c > o) return minutes >= o && minutes < c;
    return minutes >= o || minutes < c; /* يمتد بعد منتصف الليل */
  }

  function computeStatus() {
    var now = riyadhNow();
    var sch = SITE_DATA.hours.schedule[now.key];

    if (sch && shiftOpen(sch, now.minutes)) {
      return { open: true, text: SITE_DATA.ui.statusOpen + " " + fmtClock(sch[1]) };
    }

    /* وردية أمس إن امتدت بعد منتصف الليل */
    var prevKey = DAY_KEYS[(now.index + 6) % 7];
    var prev = SITE_DATA.hours.schedule[prevKey];
    if (prev) {
      var o = toMin(prev[0]), c = toMin(prev[1]);
      if (c <= o && now.minutes < c) {
        return { open: true, text: SITE_DATA.ui.statusOpen + " " + fmtClock(prev[1]) };
      }
    }

    for (var i = 0; i < 8; i++) {
      var key = DAY_KEYS[(now.index + i) % 7];
      var s = SITE_DATA.hours.schedule[key];
      if (!s) continue;
      if (i === 0 && now.minutes < toMin(s[0])) {
        return { open: false, text: SITE_DATA.ui.statusClosed + "، " + SITE_DATA.ui.opens + " " + fmtClock(s[0]) };
      }
      if (i > 0) {
        var when = i === 1 ? SITE_DATA.ui.tomorrow : dayName(key);
        return { open: false, text: SITE_DATA.ui.statusClosed + "، " + SITE_DATA.ui.opens + " " + when + " " + fmtClock(s[0]) };
      }
    }
    return { open: false, text: SITE_DATA.ui.statusClosed };
  }

      text.textContent = st.text;

    }
    var barText = $("#barStatusText");
    if (barText) barText.textContent = st.text;
    var bar = $("#barStatus");
    if (bar) bar.classList.toggle("is-open", st.open);
  }

      startScroll = track.scrollLeft;
      rtl = getComputedStyle(track).direction === "rtl";
      track.classList.add("is-dragging");
    });

    track.addEventListener("pointermove", function (e) {
      if (!down) return;
      var dx = e.clientX - startX;
      if (Math.abs(dx) > 4) moved = true;
      track.scrollLeft = rtl ? startScroll + dx : startScroll - dx;
    });

    function end() {
      down = false;
      track.classList.remove("is-dragging");
    }
    track.addEventListener("pointerup", end);
    track.addEventListener("pointercancel", end);
    track.addEventListener("pointerleave", end);
    track.addEventListener("click", function (e) {
      if (moved) { e.preventDefault(); e.stopPropagation(); }
    }, true);
  }

  /* ---------- مناطق الخدمة ---------- */
  function renderAreas() {
    var list = $("#areasList");
    if (!list) return;
    list.innerHTML = SITE_DATA.districts.map(function (d) {
      return "<li>" + SITE_DATA.areas.prefix + " " + d + "</li>";
    }).join("");
  }

  /* ---------- الطلب ---------- */
  var order = { service: null, district: null, time: null };

  function chip(label, value, group) {
    return '<button class="chip" type="button" data-group="' + group + '" data-value="' +
      value + '" aria-pressed="false">' + label + "</button>";
  }

  function renderOrderChips() {
    var s = $("#serviceChips"), d = $("#districtChips"), t = $("#timeChips");
    if (s) s.innerHTML = SITE_DATA.services.items.map(function (x) { return chip(x.title, x.title, "service"); }).join("");
    if (d) {
      d.innerHTML = SITE_DATA.districts.map(function (x) { return chip(x, x, "district"); }).join("") +
        chip(SITE_DATA.order.otherDistrict, SITE_DATA.order.otherDistrict, "district");
    }
    if (t) t.innerHTML = SITE_DATA.times.map(function (x) { return chip(x, x, "time"); }).join("");
  }

  function buildMessage() {
    var note = $("#noteInput");
    var msg = SITE_DATA.order.msgTemplate
      .replace("{service}", order.service)
      .replace("{district}", order.district)
      .replace("{time}", order.time);
    if (note && note.value.trim()) {
      msg += " " + SITE_DATA.order.notePrefix + " " + note.value.trim();
    }
    return msg;
  }

  function updateOrder() {
    var summary = $("#orderSummary");
    var btn = $("#sendBtn");
    var ready = !!(order.service && order.district && order.time);

    if (btn) btn.disabled = !ready;

    if (summary) {
      if (!ready) {
        var missing = [];
        if (!order.service) missing.push(SITE_DATA.order.step1);
        if (!order.district) missing.push(SITE_DATA.order.step2);
        if (!order.time) missing.push(SITE_DATA.order.step3);
        summary.textContent = SITE_DATA.order.summaryEmpty;
        summary.classList.remove("is-ready");
      } else {
        summary.textContent = SITE_DATA.order.summaryPrefix + " " +
          [order.service, order.district, order.time].join(" · ");
        summary.classList.add("is-ready");
      }
    }
    if (btn) {
      if (ready) btn.setAttribute("data-msg", buildMessage());
      else btn.removeAttribute("data-msg");
    }
  }

  function setChoice(group, value) {
    order[group] = value;
    $$('.chip[data-group="' + group + '"]').forEach(function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-value") === value ? "true" : "false");
    });
    updateOrder();
  }

  function initOrder() {
    renderOrderChips();
    updateOrder();

    var summary = $("#orderSummary");
    if (summary && !summary.textContent) summary.textContent = SITE_DATA.order.summaryEmpty;

    document.addEventListener("click", function (e) {
      var chipEl = e.target.closest(".chip");
      if (chipEl) {
        setChoice(chipEl.getAttribute("data-group"), chipEl.getAttribute("data-value"));
        return;
      }
      var orderBtn = e.target.closest(".card__order");
      if (orderBtn) {
        var svc = SITE_DATA.services.items.filter(function (x) { return x.id === orderBtn.getAttribute("data-service"); })[0];
        if (!svc) return;
        setChoice("service", svc.title);
        var panel = $("#contact");
        if (panel) panel.scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "start" });
        return;
      }
      var workBtn = e.target.closest(".work");
      if (workBtn) lb.open(Number(workBtn.getAttribute("data-work")));
    });

    var send = $("#sendBtn");
    if (send) {
      send.addEventListener("click", function () {
        var msg = send.getAttribute("data-msg");
        if (!msg) return;
        window.open("https://wa.me/" + SITE_DATA.contact.whatsapp + "?text=" + encodeURIComponent(msg), "_blank", "noopener");
      });
    }

    var note = $("#noteInput");
    if (note) note.addEventListener("input", updateOrder);
  }

  /* ---------- القائمة ---------- */
  function initNav() {
    var burger = $("#burger"), nav = $("#nav"), backdrop = $("#navBackdrop");
    if (!burger || !nav) return;

    function setOpen(open) {
      document.documentElement.classList.toggle("nav-open", open);
      burger.setAttribute("aria-expanded", open ? "true" : "false");
      burger.setAttribute("aria-label", open ? SITE_DATA.ui.menuClose : SITE_DATA.ui.menuOpen);
      document.documentElement.style.overflow = open ? "hidden" : "";
      if (backdrop) {
        if (open) { backdrop.hidden = false; }
        else { backdrop.hidden = true; }
      }
    }

    burger.addEventListener("click", function () {
      setOpen(!document.documentElement.classList.contains("nav-open"));
    });
    if (backdrop) backdrop.addEventListener("click", function () { setOpen(false); });
    $$("a", nav).forEach(function (a) { a.addEventListener("click", function () { setOpen(false); }); });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && document.documentElement.classList.contains("nav-open")) {
        setOpen(false);
        burger.focus();
      }
    });
    window.addEventListener("resize", function () {
      if (window.innerWidth > 900 && document.documentElement.classList.contains("nav-open")) setOpen(false);
    });

    var header = $("#siteHeader");
    if (header) {
      var onScroll = function () { header.classList.toggle("is-stuck", window.scrollY > 8); };
      onScroll();
      window.addEventListener("scroll", onScroll, { passive: true });
    }
  }

  /* ---------- التشغيل ---------- */
  function init() {
    applyMeta();
    renderLogo();
    applyText();
    applyAttrs();
    applyIcons();
    applyLinks();
    injectJsonLd();

    renderServices();
    renderFacts();
    renderFeatures();
    renderWorks();
    renderAreas();
    renderHours();
    initOrder();
    initNav();
    initDrag();
    lb.init();
    renderStatus();

    setInterval(function () { renderStatus(); renderHours(); }, 60000);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();

</script>
</body>
</html>
